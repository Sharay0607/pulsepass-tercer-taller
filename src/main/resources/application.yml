spring:
  application:
    name: pulsepass

  datasource:
    url: jdbc:postgresql://localhost:5432/pulsepass
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

pulsepass:
  security:
    jwt:
      issuer: ${PULSEPASS_JWT_ISSUER:pulsepass-api}
      secret-base64: ${PULSEPASS_JWT_SECRET_BASE64}   # sin valor por defecto: si falta, la app NO arranca
      access-token-ttl: PT15M

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
