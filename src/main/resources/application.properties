spring:
  application:
    name: pulsepass

  datasource:
    url: jdbc:postgresql://localhost:5432/pulsepass
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration


pulsepass.security.jwt.issuer=${PULSEPASS_JWT_ISSUER:pulsepass-api}
pulsepass.security.jwt.secret-base64=${PULSEPASS_JWT_SECRET_BASE64:dUltZXBhc3Nfc2VjcmV0X2tleV9mb3Jfand0X3NpZ25pbmdfMjAyNl92ZXJ5X3NlY3VyZQ==}
pulsepass.security.jwt.access-token-ttl=PT15M