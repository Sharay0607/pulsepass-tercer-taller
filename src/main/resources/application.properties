spring:
  application:
    name: pulsepass

  datasource:
    url: jdbc:postgresql://localhost:5432/pulsepass
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration